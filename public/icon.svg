<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="door" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle with Android maskable safe margins -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Refrigerator Body -->
  <g transform="translate(106, 80)">
    <!-- Outer Fridge Shell -->
    <rect x="0" y="0" width="300" height="352" rx="40" fill="url(#door)" stroke="#065f46" stroke-width="12" />
    
    <!-- Freezer Door (Top) -->
    <path d="M 0 40 Q 0 0 40 0 L 260 0 Q 300 0 300 40 L 300 120 L 0 120 Z" fill="#ffffff" />
    <!-- Divider Line -->
    <line x1="0" y1="120" x2="300" y2="120" stroke="#059669" stroke-width="10" stroke-linecap="round" />

    <!-- Fridge Door (Bottom) -->
    <path d="M 0 120 L 300 120 L 300 312 Q 300 352 260 352 L 40 352 Q 0 352 0 312 Z" fill="#f0fdf4" />

    <!-- Top Handle -->
    <rect x="36" y="44" width="16" height="48" rx="8" fill="#059669" />

    <!-- Bottom Handle -->
    <rect x="36" y="150" width="16" height="90" rx="8" fill="#059669" />

    <!-- Food / Sparkle Icons on Fridge -->
    <!-- Chef Hat Badge -->
    <g transform="translate(130, 160) scale(1.4)">
      <path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z" fill="#10b981" opacity="0.9" />
      <line x1="6" y1="17" x2="18" y2="17" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Carrot / Healthy Food Icon -->
    <circle cx="210" cy="60" r="16" fill="#fbbf24" opacity="0.9" />
    <path d="M210 44 Q 218 36 226 40" stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round" />
  </g>
</svg>
