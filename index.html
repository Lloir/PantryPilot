<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PantryPal - Smart Grocery, Receipt Scanner & Meal Cost Planner</title>
    <meta name="description" content="Scan grocery receipts and barcodes, manage real-time inventory, calculate recipe cooking costs, plan weekly meals with automated stock deduction forecasting, and get expiry-smart recipe recommendations." />
    
    <!-- Android & PWA Meta Tags -->
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PantryPal" />
    <meta name="application-name" content="PantryPal" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />

    <meta property="og:title" content="PantryPal - Smart Grocery, Receipt Scanner & Meal Cost Planner" />
    <meta property="og:description" content="Scan grocery receipts and barcodes, manage real-time inventory, calculate recipe cooking costs, plan weekly meals with automated stock deduction forecasting, and get expiry-smart recipe recommendations." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before first paint so dark mode doesn't flash white
      (function () {
        try {
          var t = localStorage.getItem('pantrypal_theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) { document.documentElement.classList.add('dark'); document.documentElement.style.colorScheme = 'dark'; }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
